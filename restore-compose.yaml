include:
  - opencloud-compose.yaml

services:
  rclone-restore:
    build:
      context: ./rclone
      dockerfile: Dockerfile
    image: rclone-zstd:latest
    pull_policy: build
    user: "${CONTAINER_UID}:${CONTAINER_GID}"
    environment:
      AWS_ACCESS_KEY_ID: ${STORAGE_USERS_DECOMPOSEDS3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_USERS_DECOMPOSEDS3_SECRET_KEY}
      TZ: ${TZ}
    volumes:
      - ./rclone/config:/config/rclone
      - ${SSD_PATH}/opencloud:/data/opencloud
      - ${HDD_PATH}/immich/data/backups:/data/immich/backups
      - ${HDD_PATH}/immich/data/library:/data/immich/library
      - ${HDD_PATH}/immich/data/profile:/data/immich/profile
      - ${HDD_PATH}/immich/data/upload:/data/immich/upload
      - ${SSD_PATH}/rclone/dump:/data/opencloud-dump
    entrypoint: ["/bin/sh", "-c"]
    command: |
      'rclone lsl backup-opencloud:
       echo Enter filename to restore opencloud: 
       read OC_ARCHIVE
       rclone sync backup-immich-data: /data/immich & \
       rclone sync backup-garage: garage:opencloud & \
       rclone sync backup-opencloud: /data/opencloud-dump && \
       cat /data/opencloud-dump/$$OC_ARCHIVE | zstd -d | tar xf - & \
       wait'
    tty: true
    stdin_open: true
    depends_on:
      garage:
        condition: service_healthy
  rclone-restore-request:
    build:
      context: ./rclone
      dockerfile: Dockerfile
    image: rclone-zstd:latest
    pull_policy: build
    user: "${CONTAINER_UID}:${CONTAINER_GID}"
    environment:
      TZ: ${TZ}
    volumes:
      - ./rclone/config:/config/rclone
    entrypoint: ["/bin/sh", "-c"]
    command: |
      'rclone backend restore s3-deep-archive:home-backup-garage -o priority=Bulk -o lifetime=5 & \
       rclone backend restore s3-deep-archive:home-backup-opencloud -o priority=Bulk -o lifetime=5 & \
       rclone backend restore s3-deep-archive:home-backup-immich-data -o priority=Bulk -o lifetime=5 & \
       wait'