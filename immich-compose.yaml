services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    user: "${UID}:${GID}"
    environment:
      TZ: ${TZ}
      DB_HOSTNAME: immich-database 
      DB_PASSWORD: ${IM_DB_PASSWORD}
      DB_USERNAME: ${IM_DB_USERNAME}
      DB_DATABASE_NAME: ${IM_DB_DATABASE_NAME}
      REDIS_HOSTNAME: immich-redis
      IMMICH_CONFIG_FILE: /configuration.json
    # extends:
    #   file: hwaccel.transcoding.yml
    #   service: cpu # set to one of [nvenc, quicksync, rkmpp, vaapi, vaapi-wsl] for accelerated transcoding
    volumes:
      # Do not edit the next line. If you want to change the media storage location on your system, edit the value of UPLOAD_LOCATION in the .env file
      - ./immich/data:/data
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env.immich
    depends_on:
      - immich-redis
      - immich-database
    restart: always
    healthcheck:
      disable: false
    labels:
      - "traefik.enable=true"
      # define middleware here, to make sure its loaded with the first defined container (opencloud)
      # if defined in the traefik container with a disabled dashboard it won't be loaded fast enough
      - "traefik.http.middlewares.hsts-header.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.hsts-header.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.hsts-header.headers.stsPreload=true"
      - "traefik.http.middlewares.hsts-header.headers.forceSTSHeader=true"
      - "traefik.http.routers.immich-server.entrypoints=https"
      - "traefik.http.routers.immich-server.rule=Host(`${IM_DOMAIN}`)"
      - "traefik.http.routers.immich-server.service=immich-server"
      - "traefik.http.routers.immich-server.middlewares=hsts-header"
      - "traefik.http.services.immich-server.loadbalancer.server.port=2283"
      - "traefik.http.routers.immich-server.tls=true"
      - "traefik.http.routers.immich-server.tls.certresolver=letsencrypt"
      - "traefik.http.routers.immich-server.tls.domains[0].main=${TRAEFIK_CERT_DOMAIN}"

  immich-machine-learning:
    # For hardware acceleration, add one of -[armnn, cuda, rocm, openvino, rknn] to the image tag.
    # Example tag: ${IMMICH_VERSION:-release}-cuda
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    # extends: # uncomment this section for hardware acceleration - see https://docs.immich.app/features/ml-hardware-acceleration
    #   file: hwaccel.ml.yml
    #   service: cpu # set to one of [armnn, cuda, rocm, openvino, openvino-wsl, rknn] for accelerated inference - use the `-wsl` version for WSL2 where applicable
    volumes:
      - model-cache:/cache
    env_file:
      - .env.immich
    restart: always
    healthcheck:
      disable: false

  immich-redis:
    image: docker.io/valkey/valkey:9@sha256:3b55fbaa0cd93cf0d9d961f405e4dfcc70efe325e2d84da207a0a8e6d8fde4f9
    healthcheck:
      test: redis-cli ping || exit 1
    restart: always

  immich-database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    user: "${UID}:${GID}"
    environment:
      POSTGRES_PASSWORD: ${IM_DB_PASSWORD}
      POSTGRES_USER: ${IM_DB_USERNAME}
      POSTGRES_DB: ${IM_DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
      # Uncomment the DB_STORAGE_TYPE: 'HDD' var if your database isn't stored on SSDs
      # DB_STORAGE_TYPE: 'HDD'
    volumes:
      # Do not edit the next line. If you want to change the database storage location on your system, edit the value of DB_DATA_LOCATION in the .env file
      - ./immich/db:/var/lib/postgresql/data
    shm_size: 128mb
    restart: always
    healthcheck:
      disable: false

volumes:
  model-cache:
