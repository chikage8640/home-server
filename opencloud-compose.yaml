services:
  opencloud:
    image: opencloudeu/opencloud-rolling:latest
    user: "${CONTAINER_UID}:${CONTAINER_GID}"
    entrypoint:
      - /bin/sh
    # run opencloud init to initialize a configuration file with random secrets
    # it will fail on subsequent runs, because the config file already exists
    # therefore we ignore the error and then start the opencloud server
    command: ["-c", "opencloud init || true; opencloud server"]
    environment:
      OC_INSECURE: "false"
      PROXY_TLS: "false"
      OC_DEFAULT_LANGUAGE: "${OC_DEFAULT_LANGUAGE}"
      OC_URL: "https://${OC_DOMAIN}"
      STORAGE_USERS_DRIVER: "decomposeds3"
      STORAGE_USERS_DECOMPOSEDS3_REGION: "garage"
      STORAGE_USERS_DECOMPOSEDS3_ACCESS_KEY: "${STORAGE_USERS_DECOMPOSEDS3_ACCESS_KEY}"
      STORAGE_USERS_DECOMPOSEDS3_SECRET_KEY: "${STORAGE_USERS_DECOMPOSEDS3_SECRET_KEY}"
      STORAGE_USERS_DECOMPOSEDS3_ENDPOINT: "http://garage:3900"
      STORAGE_USERS_DECOMPOSEDS3_BUCKET: "${STORAGE_USERS_DECOMPOSEDS3_BUCKET}"
      PROXY_CSP_CONFIG_FILE_LOCATION: /etc/opencloud/csp.yaml
      FRONTEND_READONLY_USER_ATTRIBUTES: "user.onPremisesSamAccountName,user.displayName,user.mail,user.passwordProfile,user.accountEnabled,user.appRoleAssignments"
      PROXY_OIDC_REWRITE_WELLKNOWN: "true"
      OC_OIDC_CLIENT_ID: ${OC_OIDC_CLIENT_ID}
      PROXY_ROLE_ASSIGNMENT_OIDC_CLAIM: ${PROXY_ROLE_ASSIGNMENT_OIDC_CLAIM:-roles}
      PROXY_ROLE_ASSIGNMENT_DRIVER: ${PROXY_ROLE_ASSIGNMENT_DRIVER:-oidc}
      OC_OIDC_ISSUER: "https://${IDP_DOMAIN}/realms/${KEYCLOAK_REALM}"
      # This specifies to start all services except idm and idp. These are replaced by external services.
      OC_EXCLUDE_RUN_SERVICES: idp
      PROXY_AUTOPROVISION_ACCOUNTS: "true"
      # Use the `sub` claim from the IdP for the user ID
      # Most IdPs use the internal user ID as the `sub` claim
      PROXY_USER_OIDC_CLAIM: "sub"
      # Use the `sub` claim as identifier during autoprovisioning
      # That mitigates problems when a user is renamed in the IdP
      PROXY_AUTOPROVISION_CLAIM_USERNAME: "sub"
      PROXY_USER_CS3_CLAIM: "username"
      OC_ADMIN_USER_ID: ""
      SETTINGS_SETUP_DEFAULT_ASSIGNMENTS: "false"
      GRAPH_ASSIGN_DEFAULT_USER_ROLE: ${GRAPH_ASSIGN_DEFAULT_USER_ROLE:-false}
      GRAPH_USERNAME_MATCH: "none"
      # We need to set the IDP_DOMAIN to allow the CSP rules to be set correctly
      IDP_DOMAIN: "${IDP_DOMAIN}"
      # The openCloud users need to be able to edit their account in the externa IdP
      WEB_OPTION_ACCOUNT_EDIT_LINK_HREF: "https://${IDP_DOMAIN}/realms/${KEYCLOAK_REALM}/account"
    volumes:
      - ${SSD_PATH}/opencloud/config:/etc/opencloud
      - ${SSD_PATH}/opencloud/data:/var/lib/opencloud
    depends_on:
      garage:
        condition: service_healthy
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.opencloud.entrypoints=https"
      - "traefik.http.routers.opencloud.rule=Host(`${OC_DOMAIN}`)"
      - "traefik.http.routers.opencloud.middlewares=hsts-header"
      - "traefik.http.services.opencloud.loadbalancer.server.port=9200"
      - "traefik.http.routers.opencloud.tls=true"
      - "traefik.http.routers.opencloud.tls.certresolver=letsencrypt"
      - "traefik.http.routers.opencloud.tls.domains[0].main=${TRAEFIK_CERT_DOMAIN}"
      
  garage:
    image: dxflrs/garage:v2.3.0
    user: "${CONTAINER_UID}:${CONTAINER_GID}"
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: "${STORAGE_USERS_DECOMPOSEDS3_ACCESS_KEY}"
      GARAGE_DEFAULT_SECRET_KEY: "${STORAGE_USERS_DECOMPOSEDS3_SECRET_KEY}"
      GARAGE_DEFAULT_BUCKET: "${STORAGE_USERS_DECOMPOSEDS3_BUCKET}"
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    volumes:
      - ${SSD_PATH}/garage/garage.toml:/etc/garage.toml
      - ${SSD_PATH}/garage/meta:/var/lib/garage/meta
      - ${HDD_PATH}/garage/data:/var/lib/garage/data
    restart: always
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 10s
      retries: 30
